name: PocketBase Staging Schema Management

on:
  push:
    branches: [develop]
    paths:
      - 'apps/eco-store/pocketbase/**'
      - 'apps/eco-store/scripts/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - sync
          - export

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NX_NO_CLOUD: true

jobs:
  sync-schema:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'sync')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync Schema to PocketBase
        run: node apps/eco-store/scripts/sync-pocketbase-schema.js
        env:
          POCKETBASE_STAGING_ADMIN_EMAIL: ${{ secrets.POCKETBASE_STAGING_ADMIN_EMAIL }}
          POCKETBASE_STAGING_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_STAGING_ADMIN_PASSWORD }}

      - name: Deploy Hooks to PocketBase via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.POCKETBASE_STAGING_SFTP_HOST }}
          username: ${{ secrets.POCKETBASE_STAGING_SFTP_USERNAME }}
          # Block scalar appends the trailing newline OpenSSH needs after the END marker:
          # `gh secret set` strips it from stdin and the action writes the key with printf "%s".
          ssh_private_key: |
            ${{ secrets.POCKETBASE_STAGING_SFTP_KEY }}
          port: 2222
          local_path: ./apps/eco-store/pocketbase/pb_hooks/*
          remote_path: /eco-botiga/pb_hooks
          sftp_only: true
          # Never set delete_remote_files: true — it rm -rf's remote_path, which also holds
          # PockHost's own _ph_*.js files that are not in this repo.

  export-schema:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'export'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Export Schema from PocketBase
        run: node apps/eco-store/scripts/export-pocketbase-schema.js
        env:
          POCKETBASE_STAGING_ADMIN_EMAIL: ${{ secrets.POCKETBASE_STAGING_ADMIN_EMAIL }}
          POCKETBASE_STAGING_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_STAGING_ADMIN_PASSWORD }}

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/eco-store/pocketbase/pb_schema.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update PocketBase schema [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
