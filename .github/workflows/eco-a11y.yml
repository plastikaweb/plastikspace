name: Eco a11y

# The Playwright + axe suite of eco-store and eco-admin (apps/eco-a11y-e2e, META-40), which
# replaced their Pa11y workflows. It builds both apps and answers PocketBase from fixtures, so it
# needs no secrets. It runs in the Google Chrome of the runner image (`channel: 'chrome'`).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - develop

permissions:
  actions: read
  contents: read

jobs:
  eco-a11y:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable --network-timeout 1000000

      - name: Check Nx Cloud Availability
        run: |
          # Try a real nx command with record and capture output
          npx nx-cloud record -- npx nx --version > nx_cloud_check.log 2>&1 || true
          if grep -iE "disabled|authorized|exceeding|failed to record" nx_cloud_check.log; then
            echo "NX_CLOUD_RECORD=" >> $GITHUB_ENV
            echo "NX_CLOUD_FLAGS=--no-cloud" >> $GITHUB_ENV
            echo "Nx Cloud is disabled or out of credits. Running locally."
          else
            echo "NX_CLOUD_RECORD=npx nx-cloud record --" >> $GITHUB_ENV
            echo "NX_CLOUD_FLAGS=" >> $GITHUB_ENV
            echo "Nx Cloud is active."
          fi

      - name: Build both apps and run the suite
        run: ${{ env.NX_CLOUD_RECORD }} yarn nx run eco-a11y-e2e:e2e ${{ env.NX_CLOUD_FLAGS }}

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-a11y-report
          path: dist/.playwright/apps/eco-a11y-e2e/playwright-report
          retention-days: 14
