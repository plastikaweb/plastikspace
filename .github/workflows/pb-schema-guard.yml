name: PocketBase schema guard

# META-12. Every worktree exports the same local PocketBase into pb_schema.json, so a
# branch can carry schema edits made for another branch; on merge to develop,
# pocketbase-schema.yml applies the file to staging, which drops the fields it lacks
# (it never deletes collections). This check compares develop now with the PR's merge
# commit (what the sync would apply) and fails on a schema change without other eco
# files, or on removals, unless the PR carries the `pb-schema` label. Adding or removing
# the label re-runs it. The label covers the schema it was added for: when a push
# changes pb_schema.json and the check then fails, the run removes the label, to be
# added again after review. Only a push run can tell whether the schema changed: a run
# started by reopening the PR honours the label.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'apps/eco-store/pocketbase/pb_schema.json'
      - 'tools/scripts/check-pb-schema-change.cjs'
      - 'tools/scripts/test-pb-schema-check.sh'
      - '.github/workflows/pb-schema-guard.yml'

permissions:
  contents: read
  # To remove a pb-schema label that a later schema change voided.
  pull-requests: write

jobs:
  pb-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the merge commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Fixture tests for the guard
        run: bash tools/scripts/test-pb-schema-check.sh

      # HEAD is refs/pull/N/merge; its first parent is the develop tip it was merged onto.
      - name: Compare pb_schema.json with develop
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SCHEMA=apps/eco-store/pocketbase/pb_schema.json
          CHECK=tools/scripts/check-pb-schema-change.cjs
          git show "HEAD^1:$SCHEMA" > "$RUNNER_TEMP/pb_schema.base.json"
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          # The label acknowledges the schema it was added for. A push that changes the
          # schema (a merge from develop included) voids it; regenerated view ids or a new
          # order are no change. A previous head lost to a force-push counts as a change.
          STALE=
          if [ "$EVENT_ACTION" = synchronize ]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true
            if ! git show "$BEFORE:$SCHEMA" > "$RUNNER_TEMP/pb_schema.before.json" 2>/dev/null ||
              ! git show "$AFTER:$SCHEMA" > "$RUNNER_TEMP/pb_schema.after.json" ||
              ! node "$CHECK" --compare-only \
                --base "$RUNNER_TEMP/pb_schema.before.json" --head "$RUNNER_TEMP/pb_schema.after.json"; then
              STALE=--label-stale
            fi
          fi
          RC=0
          node "$CHECK" \
            --base "$RUNNER_TEMP/pb_schema.base.json" \
            --head "$SCHEMA" \
            --changed "$RUNNER_TEMP/changed.txt" \
            --labels "$PR_LABELS" \
            $STALE \
            --summary "$GITHUB_STEP_SUMMARY" || RC=$?
          # A voided label is removed, so that the next push cannot make it count again.
          # A label change made with GITHUB_TOKEN starts no new run.
          case ",$PR_LABELS," in
            *,pb-schema,*)
              if [ "$RC" -eq 1 ] && [ -n "$STALE" ]; then
                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/pb-schema" > /dev/null; then
                  echo "The pb-schema label was removed: add it again once the table is reviewed." |
                    tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning title=pb-schema label::The voided pb-schema label could not be removed: remove it and add it again once the table is reviewed."
                fi
              fi
              ;;
          esac
          exit "$RC"
