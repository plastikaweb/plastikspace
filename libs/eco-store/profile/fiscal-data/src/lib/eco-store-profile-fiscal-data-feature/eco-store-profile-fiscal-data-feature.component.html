<section class="flex max-w-[650px] flex-col gap-6">
  <p class="text-on-surface/80 text-md">{{ 'profile.fiscalData.description' | translate }}</p>

  <!-- Fiscal data form -->
  <plastik-shared-form-feature
    [fields]="formConfig.getConfig()"
    [submitConfig]="formConfig.getSubmitFormConfig?.() || {}"
    [model]="model()"
    (changeEvent)="onSubmit($event)">
  </plastik-shared-form-feature>
</section>
