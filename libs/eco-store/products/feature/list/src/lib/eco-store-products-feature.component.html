<eco-store-hero-header
  subtitleClass="category-subtitle text-sys-primary flex items-center gap-2 text-xs font-bold tracking-[0.1em] uppercase"
  titleClass="category-title text-3xl font-black tracking-tight sm:text-4xl"
  [icon]="category()?.icon ?? ''"
  [subtitle]="'common.a11y.productsCount' | translate: { count: productsStore.count() }"
  [title]="category()?.name ?? ''">
  <plastik-sort-selector
    heroAction
    [class.pointer-events-none]="productsStore.isLoading()"
    [class.opacity-60]="productsStore.isLoading()"
    [options]="productsStore.sortOptions()"
    [currentSort]="productsStore.sort()"
    [translationPrefix]="'products.filter.sort'"
    (sortChange)="sort($event)"></plastik-sort-selector>
</eco-store-hero-header>

<!-- Products Grid -->
<section [attr.aria-label]="'common.a11y.productList' | translate">
  <ul class="products-grid">
    @if (productsStore.isLoading()) {
      @for (i of skeletonItems(); track $index) {
        <li
          aria-hidden="true"
          class="border-outline-variant bg-surface animate-pulse rounded-xl border p-4 shadow-sm"
          [style.--delay]="$index * 50 + 'ms'">
          <!-- Image block -->
          <div class="bg-surface-container-high/80 mb-4 aspect-square w-full rounded-xl"></div>
          <!-- Title lines -->
          <div class="bg-surface-container-high mb-2 h-3 w-1/3 rounded-full"></div>
          <div class="bg-surface-container-high mb-2 h-5 w-5/6 rounded-full"></div>
          <div class="bg-surface-container-high mb-6 h-5 w-2/3 rounded-full"></div>
          <!-- Price and button -->
          <div class="bg-surface-container-high/60 mb-8 h-8 w-1/2 rounded-full"></div>
          <div class="bg-surface-container-high/80 h-12 w-full rounded-xl"></div>
        </li>
      }
    } @else {
      @for (item of productsStore.productsWithTranslatedText(); track item.id; let i = $index) {
        <li class="reveal-up list-none" [style.--delay]="i * 50 + 'ms'">
          <eco-store-product-card
            [product]="item"
            [quantity]="cartStore.getItemCount(item.id)()"
            [isFirst]="i < 6"
            [isOpen]="tenantStore.isStoreOpen()"
            (addToCart)="addToCart($event)"
            (toggleFavorite)="toggleFavorite($event)"></eco-store-product-card>
        </li>
      }
    }
  </ul>
</section>

@if (!productsStore.isLoading()) {
  @defer (on viewport; prefetch on idle) {
    <plastik-pagination
      class="mt-6"
      plastikPocketbasePaginationNavigation
      [pageSize]="productsStore.getPagination().perPage"
      [pageIndex]="productsStore.getPagination().page"
      [pageSizeOptions]="productsStore.paginationSizeOptions()"
      [count]="productsStore.count()" />
  } @placeholder {
    <div
      aria-hidden="true"
      class="bg-surface-container mt-6 h-12 w-full animate-pulse rounded"></div>
  }
}
