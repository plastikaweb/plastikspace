<eco-store-auth-container [isLoading]="isLoading()">
  <span title>{{ 'auth.forgotPasswordSent.title' | translate }}</span>
  <span description>{{ 'auth.forgotPasswordSent.description' | translate }}</span>

  <div content class="flex flex-col gap-6">
    <div
      class="bg-primary-50 dark:bg-primary-900/20 border-primary-100 dark:border-primary-800 flex flex-row items-center justify-start gap-4 rounded-xl border p-4">
      <mat-icon class="contents!">info</mat-icon>
      <p class="text-primary-800 dark:text-primary-200 text-sm leading-relaxed font-medium">
        {{ 'auth.forgotPasswordSent.checkSpam' | translate }}
      </p>
    </div>

    <a
      matButton
      appearance="outlined"
      class="w-full! flex-row-reverse gap-2 py-6! text-sm! font-black! tracking-widest"
      routerLink="/accedir">
      <mat-icon aria-hidden="true" iconPositionEnd class="ml-1 scale-110 align-middle"
        >arrow_back</mat-icon
      >
      {{ 'auth.forgotPasswordSent.backToLogin' | translate }}
    </a>
  </div>
</eco-store-auth-container>
