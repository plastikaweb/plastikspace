<eco-store-auth-container [isLoading]="facade.isLoading?.() ?? false">
  <span title>{{ 'auth.forgotPassword.title' | translate }}</span>
  <span description>{{ 'auth.forgotPassword.description' | translate }}</span>
  <div content>
    <plastik-shared-form-feature
      [fields]="facade.formConfig.getConfig()"
      [submitConfig]="facade.formConfig.getSubmitFormConfig?.() ?? null"
      (changeEvent)="facade.onSubmit($event)">
      <div class="mt-4 flex items-center justify-center">
        <a
          matButton
          class="text-primary-700 dark:text-primary-300 text-xs! font-black tracking-widest"
          routerLink="/accedir">
          <mat-icon aria-hidden="true" iconPositionStart class="mr-1 scale-90 align-middle"
            >arrow_back</mat-icon
          >
          {{ 'auth.forgotPassword.backToLogin' | translate }}
        </a>
      </div>
    </plastik-shared-form-feature>

    <a
      matButton
      appearance="outlined"
      class="mt-4! w-full! flex-row-reverse gap-2 py-6! text-sm! font-black! tracking-widest"
      routerLink="/accedir">
      <mat-icon aria-hidden="true" iconPositionEnd class="ml-1 scale-110 align-middle"
        >arrow_back</mat-icon
      >
      {{ 'auth.forgotPassword.backToLogin' | translate }}
    </a>
  </div>
</eco-store-auth-container>
