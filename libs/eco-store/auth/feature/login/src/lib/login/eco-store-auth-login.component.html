<plastik-auth-feature
  [isLoading]="facade.isLoading?.() ?? false"
  [error]="facade.error?.() ?? null">
  <span title>{{ 'auth.login.title' | translate }}</span>
  <div content>
    <plastik-shared-form-feature
      [fields]="facade.formConfig.getConfig()"
      [submitConfig]="facade.formConfig.getSubmitFormConfig?.() ?? null"
      (pendingChangesEvent)="$event && facade.clearError?.()"
      (changeEvent)="facade.onSubmit($event)">
      <div class="extra-links mt-1 mb-3 flex items-center justify-center">
        <a
          matButton
          class="text-primary-700 dark:text-primary-300 text-sm! tracking-widest"
          routerLink="/recuperar-contrasenya">
          {{ 'auth.login.recoverAccess' | translate }}
          <mat-icon aria-hidden="true" iconPositionEnd class="ml-1 align-middle"
            >lock_reset</mat-icon
          >
        </a>
      </div>
    </plastik-shared-form-feature>

    @if (joinHref(); as href) {
      <div
        class="border-outline-variant/30 mt-6 flex flex-col items-center justify-center gap-1 border-t pt-4 text-center">
        <p class="text-on-surface-variant text-xs font-bold tracking-wider">
          {{ 'auth.login.join.question' | translate }}
        </p>
        <p class="text-on-surface-variant text-sm">{{ 'auth.login.join.invite' | translate }}</p>
        <a
          matButton
          class="text-primary-700 dark:text-primary-300 text-sm! tracking-wider"
          [href]="href">
          <mat-icon aria-hidden="true">mail</mat-icon>
          {{ joinEmail() }}
        </a>
      </div>
    }
  </div>
</plastik-auth-feature>
