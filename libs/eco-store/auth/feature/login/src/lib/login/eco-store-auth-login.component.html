<eco-store-auth-container [isLoading]="facade.isLoading?.() ?? false">
  <span title>{{ 'auth.login.title' | translate }}</span>
  <div content>
    <plastik-shared-form-feature
      [fields]="facade.formConfig.getConfig()"
      [submitConfig]="facade.formConfig.getSubmitFormConfig?.() ?? null"
      (changeEvent)="facade.onSubmit($event)">
      <div class="extra-links mt-1 mb-3 flex items-center justify-center">
        <a
          matButton
          class="text-primary-700 dark:text-primary-300 text-sm! tracking-widest"
          routerLink="/recuperar-contrasenya">
          {{ 'auth.login.recoverAccess' | translate }}
          <mat-icon aria-hidden="true" iconPositionEnd class="ml-1 align-middle"
            >lock_reset</mat-icon
          >
        </a>
      </div>
    </plastik-shared-form-feature>

    <div
      class="border-outline-variant/30 mt-6 flex flex-col items-center justify-center gap-3 border-t pt-2">
      <p class="text-on-surface-variant text-xs font-bold tracking-wider opacity-60">
        {{ 'auth.login.newUserQuestion' | translate }}
      </p>
      <a
        matButton
        appearance="outlined"
        class="w-full! py-6! text-sm! font-black! tracking-widest"
        routerLink="/activar-compte">
        {{ 'auth.login.createAccount' | translate }}
        <mat-icon aria-hidden="true" iconPositionEnd class="ml-1 scale-110 align-middle"
          >how_to_reg</mat-icon
        >
      </a>
    </div>
  </div>
</eco-store-auth-container>
