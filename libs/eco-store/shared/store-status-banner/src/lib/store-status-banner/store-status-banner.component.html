<plastik-shared-alert
  [type]="alertType()"
  [icon]="icon()"
  [closable]="true"
  (closed)="dismiss.emit()">
  <strong alertTitle>{{ title() | translate }}</strong>
  <span alertSubtitle>{{ description().key | translate: description().params }}</span>

  @if (hasCountdown()) {
    <plastik-countdown
      alertSecondary
      class="text-sm font-bold"
      [segments]="segments()"
      [prefix]="status() === 'CLOSING_SOON' ? '' : 'store.status.opensIn'">
    </plastik-countdown>
  }
</plastik-shared-alert>
