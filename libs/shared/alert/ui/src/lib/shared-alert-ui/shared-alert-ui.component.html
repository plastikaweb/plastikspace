<div class="plastik-alert__body">
  <div class="flex justify-center gap-2 md:justify-start">
    <mat-icon class="plastik-alert__icon" aria-hidden="true">{{ resolvedIcon() }}</mat-icon>
    <div class="plastik-alert__title">
      <ng-content select="[alert-title]" />
    </div>
  </div>
  <div class="plastik-alert__subtitle">
    <ng-content select="[alert-subtitle]" />
  </div>
</div>

<div class="plastik-alert__secondary">
  <ng-content select="[alert-extras]" />
</div>

@if (closable()) {
  <button
    matIconButton
    class="absolute! top-1 right-1 opacity-70 hover:opacity-100"
    [attr.aria-label]="'common.close' | translate"
    [matTooltip]="'common.close' | translate"
    (click)="closed.emit()">
    <mat-icon>close</mat-icon>
  </button>
}
