<mat-form-field class="w-full">
  @if (props.label) {
    <mat-label>{{ props.label }}</mat-label>
  }
  <textarea
    #ta
    #autosize="cdkTextareaAutosize"
    matInput
    cdkTextareaAutosize
    cdkAutosizeMinRows="1"
    class="w-full leading-6"
    [required]="props.required || false"
    [formControl]="formControl"
    [formlyAttributes]="field"
    [maxLength]="props.maxLength"
    [minLength]="props.minLength"
    [cdkAutosizeMaxRows]="to['maxRows']"></textarea>
  <mat-hint
    class="text-sm"
    aria-live="polite"
    [class.text-warning]="
      props.maxLength &&
      ta.value.length >= props.maxLength * 0.9 &&
      ta.value.length < props.maxLength
    "
    [class.text-error]="props.maxLength && ta.value.length >= props.maxLength"
    >{{ ta.value.length }} / {{ props.maxLength || 0 }}
    {{ 'common.form.charactersCount' | translate: { count: props.maxLength } }}</mat-hint
  >
</mat-form-field>
